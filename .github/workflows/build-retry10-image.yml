name: Build retry-10 deployment image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/sub2api-retry10-linux-amd64.tar

      - name: Upload deployment image
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-retry10-linux-amd64
          path: /tmp/sub2api-retry10-linux-amd64.tar
          if-no-files-found: error
          retention-days: 1
