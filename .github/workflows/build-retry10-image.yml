name: Build deployment image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-token-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify quota isolation and refresh token concurrency
        working-directory: backend
        run: go test -race -tags unit -count=1 -run 'TestCodexQuota|TestNativeImages.*Quota|TestTextQuotaRecovery|TestOpenAI429FastPath|TestIsModelRateLimited|TestShouldAutoPauseOpenAI|TestRefreshTokenCacheConsumeIsAtomic|TestAuthServiceRefreshTokenPairConsumesTokenOnce' ./internal/repository ./internal/service

  build-linux-amd64-image:
    needs: refresh-token-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: sub2api:ci-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=/tmp/sub2api-retry10-linux-amd64.tar

      - name: Verify deployment image identity
        env:
          IMAGE: sub2api:ci-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker load --input /tmp/sub2api-retry10-linux-amd64.tar
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$SOURCE_SHA"
          docker run --rm --entrypoint /app/sub2api "$IMAGE" --version 2>&1 | tee /tmp/sub2api-version.txt
          grep -F "$SOURCE_SHA" /tmp/sub2api-version.txt
          grep -F "$(cat backend/cmd/server/VERSION)" /tmp/sub2api-version.txt
          docker image inspect --format '{"id":"{{.Id}}","os":"{{.Os}}","architecture":"{{.Architecture}}"}' "$IMAGE" > /tmp/sub2api-image-identity.json
          cd /tmp
          sha256sum sub2api-retry10-linux-amd64.tar > sub2api-image.sha256

      - name: Upload deployment image
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-retry10-linux-amd64
          path: |
            /tmp/sub2api-retry10-linux-amd64.tar
            /tmp/sub2api-version.txt
            /tmp/sub2api-image-identity.json
            /tmp/sub2api-image.sha256
          if-no-files-found: error
          retention-days: 1
